[package]
name = "universal_monitor"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
egui_extras = "0.28"
egui_plot = "0.28"
serialport = "4.2"
encoding_rs = "0.8"

[profile.release]
opt-level = 2
# The injected hook DLL must not depend on dbghelp.dll (Rust's default backtrace
# support pulls it in). dbghelp is present system-wide, but a 32-bit target can resolve
# it only through SysWOW64, and a failed load there makes LoadLibrary return NULL —
# measured as the reason 32-bit injection failed. abort keeps the DLL dependency-free.
panic = "abort"

[workspace]
members = ["hook", "x86_injector"]

